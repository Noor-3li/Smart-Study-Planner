<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>📚 Smart Study Planner</h1>
            <p>Enter your subjects, exam dates, and available study hours.</p>
        </header>

        <section class="card">

            <h2>Study Information</h2>

            <div class="form-group">
                <label for="studyHours">
                    Available Study Hours Per Day
                </label>

                <input
                    type="number"
                    id="studyHours"
                    min="1"
                    max="24"
                    placeholder="Example: 5"
                >
            </div>

            <h3>Subjects</h3>

            <div id="subjectsContainer">

                <div class="subject-row">

                    <input
                        type="text"
                        class="subject-name"
                        placeholder="Subject name"
                    >

                    <input
                        type="date"
                        class="exam-date"
                    >

                    <button
                        type="button"
                        class="remove-btn"
                        onclick="removeSubject(this)"
                    >
                        ✕
                    </button>

                </div>

            </div>

            <button
                type="button"
                class="add-btn"
                onclick="addSubject()"
            >
                + Add Subject
            </button>

            <button
                type="button"
                class="calculate-btn"
                onclick="calculatePlan()"
            >
                Create Study Plan
            </button>

        </section>


        <section
            class="card results"
            id="results"
            style="display: none;"
        >

            <h2>📅 Your Study Plan</h2>

            <div id="planSummary"></div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Exam Date</th>
                            <th>Days Left</th>
                            <th>Study Hours / Day</th>
                        </tr>
                    </thead>

                    <tbody id="planTable"></tbody>

                </table>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
